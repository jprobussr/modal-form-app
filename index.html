<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Form App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>Modal Form App</h1>
        <p>Practice building a real-world modal with form vailidation.</p>
        <button class="open-modal-btn" type="button">Open Form</button>
      </section>

      <div class="modal-overlay hidden">
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle"
        >
          <button
            class="close-modal-btn"
            type="button"
            aria-label="Close modal"
          >
            ×
          </button>

          <h2 id="modalTitle">Contact Form</h2>

          <form class="modal-form" id="modalForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" />

            <label for="message">Message</label>
            <textarea name="message" id="message" name="message" rows="5"></textarea>
            <button type="submit">Submit</button>
          </form>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
